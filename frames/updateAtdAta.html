<script>
(function () {
  'use strict';

  var SCOPE    = 'data-v-8769da1a';
  // /api/atd-ata is the only source of rows. The grid starts empty and stays
  // empty until the backend answers with something: fixture rows used to stand
  // in here, which meant an empty backend looked like a populated portal and
  // every write against those phantom rows was silently discarded.
  var ALL      = [];
  var columns  = APEX_DATA.ATD_COLUMNS;
  var view     = ALL.slice();
  var selected = [];
  var mode     = 'atd';       // 'atd' | 'ata'
  var editRow  = null;
  var online   = false;       // did the backend answer?
  var colFilters = {};        // header-filter state, keyed by column

  /* -------------------------------------------------------------- backend */

  /* /api/atd-ata is snake_case; the grid's column model is camelCase. */
  function rowFromApi(r) {
    return {
      mawb:     r.mawb     || '',
      hawb:     r.hawb     || '',
      customer: r.customer || '',
      airline:  r.airline  || '',
      flight:   r.flight   || '',
      status:   r.status   || '',
      pol:      r.pol      || '',
      pod:      r.pod      || '',
      slaDate:  r.sla_date || '',
      etdOrig:  r.etd_orig || '',
      eta:      r.eta      || '',
      atd:      r.atd      || '',
      ata:      r.ata      || ''
    };
  }

  function loadFromApi() {
    if (!window.APEX_API) return Promise.resolve(false);
    return APEX_API.getJSON('/api/atd-ata').then(function (data) {
      var items = (data && data.items) || [];
      // An empty result is taken at face value, first load included: the
      // backend having no rows is a real state that the grid must show as
      // "No Data" rather than paper over.
      ALL = items.map(rowFromApi);
      online = true;
      // The Customer / POD pickers are built from whatever rows are loaded, so
      // they have to be rebuilt here -- built once at startup they would list
      // the values of a grid that is no longer on screen.
      buildDataFilters();
      applyFilters();
      return true;
    }).catch(function () {
      // Served from file:// or the backend is down. Nothing is on screen and
      // nothing can be saved; the grid says "No Data" rather than inventing
      // rows that no write would ever reach.
      return false;
    });
  }

  /* --------------------------------------------------- time-rule calculator */

  function pad(n) { return String(n).padStart(2, '0'); }

  function fmt(dt) {
    return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()) +
           ' ' + pad(dt.getHours()) + ':' + pad(dt.getMinutes()) + ':00';
  }

  function calcRule(dateStr, timeStr) {
    if (!dateStr || !timeStr) return null;
    var actual = new Date(dateStr + 'T' + timeStr);
    if (isNaN(actual.getTime())) return null;
    var diffHrs = (Date.now() - actual.getTime()) / 3600000;
    if (diffHrs <= 3 && diffHrs >= -24) {
      return { value: fmt(actual), rule: '3-Hour Rule (use actual time directly)' };
    }
    if (diffHrs > 3) {
      return { value: fmt(new Date(Date.now() - 2.5 * 3600000)), rule: '2.5-Hour Rollback (now - 2.5h)' };
    }
    return { value: fmt(actual), rule: 'Scheduled (actual not yet reached)' };
  }

  /* ----------------------------------------------------------------- table */

  function render() {
    ElTableMock.render({
      mount: document.getElementById('atd-table'),
      columns: columns,
      rows: view,
      tableIndex: 1,
      scope: SCOPE,
      fixedCount: 1,
      bodyHeight: 420,
      filters: colFilters,
      onSelect: function (idxs) {
        selected = idxs;
        document.getElementById('atd-selection-count').textContent = idxs.length;
        document.getElementById('atd-selection-note').style.display = idxs.length ? '' : 'none';
      },
      onFilter: function (next) {
        colFilters = next;
        applyFilters();
      }
    });
    document.getElementById('atd-total').textContent = 'Total ' + view.length;
  }

  /* --------------------------------------------------------------- filters */

  function buildSelect(hostId, options, onPick) {
    var host = document.getElementById(hostId);
    host.innerHTML =
      '<div class="el-input el-input--small el-input--suffix">' +
        '<input type="text" readonly="readonly" placeholder="Please select" class="el-input__inner">' +
        '<span class="el-input__suffix"><span class="el-input__suffix-inner">' +
          '<i class="el-select__caret el-input__icon el-icon-arrow-up"></i>' +
        '</span></span>' +
      '</div>' +
      '<div class="el-select-dropdown el-popper" style="display:none;">' +
        '<div class="el-scrollbar"><div class="el-scrollbar__wrap">' +
          '<ul class="el-scrollbar__view el-select-dropdown__list">' +
            options.map(function (o) {
              return '<li class="el-select-dropdown__item"><span>' + ElTableMock.esc(o) + '</span></li>';
            }).join('') +
          '</ul>' +
        '</div></div>' +
      '</div>';

    var input = host.querySelector('.el-input__inner');
    var drop  = host.querySelector('.el-select-dropdown');
    input.addEventListener('click', function (e) {
      e.stopPropagation();
      drop.style.display = drop.style.display === 'none' ? '' : 'none';
    });
    drop.addEventListener('click', function (e) {
      var li = e.target.closest('.el-select-dropdown__item');
      if (!li) return;
      input.value = li.textContent.trim();
      drop.style.display = 'none';
      onPick(input.value);
    });
  }

  function uniq(key) {
    var seen = {};
    ALL.forEach(function (r) { if (r[key]) seen[r[key]] = true; });
    return ['All'].concat(Object.keys(seen).sort());
  }

  var filters = { customer: 'All', pod: 'All', status: 'All' };

  /* The two pickers whose options come from the rows themselves, rebuilt on
     every load. Status is not among them -- its vocabulary is APEX_ENUMS, not
     whatever happens to be on the grid.

     An active filter survives the rebuild when its value is still represented
     in the new rows; a reload after a write must not silently widen what the
     operator is looking at. A value that has gone falls back to All, since
     leaving it selected would filter the grid down to nothing. */
  function buildDataFilters() {
    [['flt-customer', 'customer'], ['flt-pod', 'pod']].forEach(function (pair) {
      var hostId = pair[0], key = pair[1];
      var options = uniq(key);
      if (options.indexOf(filters[key]) === -1) filters[key] = 'All';
      buildSelect(hostId, options, function (v) { filters[key] = v; applyFilters(); });
      if (filters[key] !== 'All') {
        document.getElementById(hostId).querySelector('.el-input__inner').value = filters[key];
      }
    });
  }

  function applyFilters() {
    view = ALL.filter(function (r) {
      return (filters.customer === 'All' || r.customer === filters.customer) &&
             (filters.pod      === 'All' || r.pod      === filters.pod) &&
             (filters.status   === 'All' || r.status   === filters.status) &&
             ElTableMock.matchesFilters(r, colFilters);
    });
    selected = [];
    render();
  }

  /* --------------------------------------------------------------- dialogs */

  function toast(msg, type) {
    var el = document.createElement('div');
    el.className = 'el-message el-message--' + (type || 'success');
    el.innerHTML = '<p class="el-message__content">' + ElTableMock.esc(msg) + '</p>';
    document.getElementById('toast-host').appendChild(el);
    setTimeout(function () { el.remove(); }, 2600);
  }

  document.querySelectorAll('[data-close]').forEach(function (b) {
    b.addEventListener('click', function () {
      b.closest('.el-dialog__wrapper').style.display = 'none';
    });
  });

  function openSingle(kind) {
    if (selected.length !== 1) {
      return toast('Select exactly one row to update ' + kind.toUpperCase(), 'error');
    }
    mode = kind;
    editRow = view[selected[0]];

    var isAtd = kind === 'atd';
    document.getElementById('dlg-atd-title').textContent   = isAtd ? 'Update ATD' : 'Update ATA';
    document.getElementById('f-value-label').textContent   = isAtd ? 'ATD' : 'ATA';
    document.getElementById('f-captured-label').textContent = isAtd ? 'Captured ATD' : 'Captured ATA';
    document.getElementById('f-sched-label').textContent   = isAtd ? 'ETD' : 'ETA';
    document.getElementById('f-mawb').textContent  = editRow.mawb;
    document.getElementById('f-pol').textContent   = editRow.pol;
    document.getElementById('f-pod').textContent   = editRow.pod;
    document.getElementById('f-sched').textContent = isAtd ? editRow.etdOrig : editRow.eta;

    var existing = isAtd ? editRow.atd : editRow.ata;
    var seed = existing || (isAtd ? editRow.etdOrig : editRow.eta) || '';
    var parts = seed.split(' ');
    document.getElementById('f-date').value     = parts[0] || '';
    document.getElementById('f-time').value     = (parts[1] || '').slice(0, 5);
    document.getElementById('f-cap-date').value = parts[0] || '';
    document.getElementById('f-cap-time').value = (parts[1] || '').slice(0, 5);

    recalcSingle();
    document.getElementById('dlg-atd').style.display = '';
  }

  function recalcSingle() {
    var r = calcRule(document.getElementById('f-cap-date').value,
                     document.getElementById('f-cap-time').value);
    var box = document.getElementById('f-suggest');
    if (!r) { box.style.display = 'none'; return; }
    document.getElementById('f-suggest-val').textContent  = r.value;
    document.getElementById('f-suggest-rule').textContent = r.rule;
    box.style.display = '';
    box.dataset.value = r.value;
  }

  ['f-cap-date', 'f-cap-time'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', recalcSingle);
  });

  function openBatch(kind) {
    if (!selected.length) return toast('Select at least one row first', 'error');
    mode = kind;
    var isAtd = kind === 'atd';
    document.getElementById('dlg-batch-title').textContent = isAtd ? 'Batch Update ATD' : 'Batch Update ATA';
    document.getElementById('b-value-label').textContent   = isAtd ? 'ATD' : 'ATA';
    document.getElementById('batch-info').textContent      = selected.length + ' row(s) selected.';
    var now = new Date();
    document.getElementById('b-date').value = now.toISOString().slice(0, 10);
    document.getElementById('b-time').value = pad(now.getHours()) + ':' + pad(now.getMinutes());
    recalcBatch();
    document.getElementById('dlg-batch').style.display = '';
  }

  function recalcBatch() {
    var r = calcRule(document.getElementById('b-date').value,
                     document.getElementById('b-time').value);
    var box = document.getElementById('b-suggest');
    if (!r) { box.style.display = 'none'; return; }
    document.getElementById('b-suggest-val').textContent  = r.value;
    document.getElementById('b-suggest-rule').textContent = r.rule;
    box.style.display = '';
    box.dataset.value = r.value;
  }

  ['b-date', 'b-time'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', recalcBatch);
  });

  function statusAfter(row) {
    if (row.ata) return 'Completed';
    if (row.atd) return 'Pending Arrival';
    return 'Pending Depart';
  }

  /* --------------------------------------------------------------- actions */

  var ACTIONS = {
    'update-atd': function () { openSingle('atd'); },
    'update-ata': function () { openSingle('ata'); },
    'batch-atd':  function () { openBatch('atd'); },
    'batch-ata':  function () { openBatch('ata'); },
    'exception-download': function () { toast('Exception report queued'); },
    'transit': function () { toast('Transit ATA/ATD recalculated'); },
    'clear-all-search': function () {
      filters = { customer: 'All', pod: 'All', status: 'All' };
      colFilters = {};
      ['flt-customer', 'flt-pod', 'flt-status'].forEach(function (id) {
        document.querySelector('#' + id + ' .el-input__inner').value = '';
      });
      applyFilters();
      toast('Filters cleared');
    },
    'use-suggest': function () {
      var v = document.getElementById('f-suggest').dataset.value || '';
      var p = v.split(' ');
      document.getElementById('f-date').value = p[0] || '';
      document.getElementById('f-time').value = (p[1] || '').slice(0, 5);
    },
    'use-batch-suggest': function () {
      var v = document.getElementById('b-suggest').dataset.value || '';
      var p = v.split(' ');
      document.getElementById('b-date').value = p[0] || '';
      document.getElementById('b-time').value = (p[1] || '').slice(0, 5);
    },
    'save-single': function () {
      var d = document.getElementById('f-date').value;
      var t = document.getElementById('f-time').value;
      if (!d || !t) return toast('Enter a date and time', 'error');
      var val = d + ' ' + t + ':00';
      var row = editRow;
      var field = mode;

      row[field] = val;
      row.status = statusAfter(row);
      document.getElementById('dlg-atd').style.display = 'none';
      render();

      var okMsg = field.toUpperCase() + ' set to ' + val + ' for ' + row.mawb;
      if (!online) {
        // Say so rather than reporting a save that never left the browser.
        return toast(okMsg + ' (offline - not saved)', 'warning');
      }
      var body = {};
      body[field] = val;
      APEX_API.patchJSON('/api/atd-ata/' + encodeURIComponent(row.mawb), body)
        .then(function (res) {
          if (res && res.row) { row.status = res.row.status; render(); }
          toast(okMsg);
        })
        .catch(function (err) {
          toast('Save failed for ' + row.mawb + ': ' + (err && err.message || err), 'error');
        });
    },
    'save-batch': function () {
      var d = document.getElementById('b-date').value;
      var t = document.getElementById('b-time').value;
      if (!d || !t) return toast('Enter a date and time', 'error');
      var val = d + ' ' + t + ':00';
      var field = mode;
      var mawbs = selected.map(function (i) { return view[i].mawb; });

      selected.forEach(function (i) {
        view[i][field] = val;
        view[i].status = statusAfter(view[i]);
      });
      document.getElementById('dlg-batch').style.display = 'none';
      var n = selected.length;
      selected = [];
      render();

      var okMsg = field.toUpperCase() + ' set on ' + n + ' shipment(s)';
      if (!online) return toast(okMsg + ' (offline - not saved)', 'warning');

      APEX_API.postJSON('/api/atd-ata/batch-update', { mawbs: mawbs, field: field, value: val })
        .then(function () { toast(okMsg); })
        .catch(function (err) {
          toast('Batch save failed: ' + (err && err.message || err), 'error');
        });
    }
  };

  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var fn = ACTIONS[btn.getAttribute('data-action')];
    if (fn) fn();
  });

  /* ------------------------------------------------------------------ init */

  buildDataFilters();
  buildSelect('flt-status',   ['All'].concat(APEX_ENUMS.ATD_STATUS),
                                                function (v) { filters.status = v;   applyFilters(); });
  render();

  // The first render is an empty grid on purpose -- the backend is the only
  // source of rows, so anything on screen before this resolves would be
  // invented. A bot must wait for rows to appear rather than for a reload.
  loadFromApi();

  try {
    parent.postMessage({ source: 'apex-frame', page: 'updateAtdAta', rows: view.length }, '*');
  } catch (err) { /* cross-origin in production */ }

  window.__APEX_MOCK__ = {
    page: 'updateAtdAta',
    rowCount: function () { return view.length; },
    isOnline: function () { return online; },
    reload: loadFromApi
  };
})();
</script>
</body>
</html>
