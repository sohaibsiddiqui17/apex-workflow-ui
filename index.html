<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX Workflow X-Control</title>
<!-- ---------------------------------------------------------------------------
     The X-Control admin shell.

     This page is deliberately NOT the application. It reproduces the four-layer
     structure of the real portal:

       login.html                        SSO sign-in
         -> index.html                   this HPlus/jQuery shell  (layer 2)
              -> iframe[name=iframe0]    frames/home.html         (layer 3+4)
              -> iframe[name=iframe16]   frames/importConfirm.html
              -> iframe[name=iframe2]    frames/updateAtdAta.html

     Frame names are derived from the menu item's data-index, exactly as
     production does, and opened frames are hidden with style="display:none"
     rather than destroyed — so a bot must switch frames, not wait for a
     reload. Nothing here uses Shadow DOM, because the real portal does not:
     its encapsulation is the iframe boundary plus Vue's data-v-* scoping.
     --------------------------------------------------------------------------- -->
<link rel="stylesheet" href="assets/hplus.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="fixed-sidebar full-height-layout gray-bg">

<div id="wrapper">

  <!-- ==================== LEFT MENU ==================== -->
  <nav class="navbar-default navbar-static-side" role="navigation">
    <div class="sidebar-collapse">
      <ul class="nav" id="side-menu">
        <li class="nav-header">
          <div class="profile-element">
            <div class="user-avatar">AH</div>
            <span class="user-text">
              <strong id="userName">ASIF.HASAN-SFO</strong>
              <span class="text-muted" id="companyCode">APEX-SFO</span>
            </span>
          </div>
        </li>
        <!-- menu items are rendered from assets/apex-menu.js -->
      </ul>
    </div>
  </nav>

  <!-- ==================== PAGE ==================== -->
  <div id="page-wrapper" class="gray-bg dashbard-1">

    <div class="row border-bottom">
      <nav class="navbar navbar-static-top" role="navigation">
        <div class="navbar-header">
          <a class="navbar-minimalize minimalize-styl-2 btn btn-primary" href="#" id="btn-minimalize">
            <i class="fa fa-bars"></i>
          </a>
        </div>
        <form role="search" class="navbar-form-custom" onsubmit="return false;">
          <div class="form-group">
            <input type="text" placeholder="Search ..." class="form-control" name="top-search" id="top-search">
          </div>
        </form>
        <ul class="nav navbar-top-links navbar-right">
          <li class="dropdown hidden-xs">
            <a class="right-sidebar-toggle"><i class="fa fa-tasks"></i> Theme</a>
          </li>
        </ul>
      </nav>
    </div>

    <!-- ---------- tab strip (contabs.js in production) ---------- -->
    <div class="row content-tabs">
      <a class="navbar-minimalize minimalize-styl-2 btn" href="#" id="btn-minimalize-2"><i class="fa fa-bars"></i></a>
      <button class="roll-nav roll-left J_tabLeft"><i class="fa fa-backward"></i></button>
      <nav class="page-tabs J_menuTabs">
        <div class="page-tabs-content" id="page-tabs-content">
          <a href="javascript:;" class="active J_menuTab" data-id="frames/home.html" data-index="0">HomePage</a>
        </div>
      </nav>
      <button class="roll-nav roll-right J_tabRight"><i class="fa fa-forward"></i></button>
      <div class="btn-group roll-nav roll-right">
        <button class="dropdown J_tabClose" data-toggle="dropdown" id="btn-more">
          More<span class="caret"></span>
        </button>
        <ul role="menu" class="dropdown-menu dropdown-menu-right" id="tab-dropdown">
          <li class="J_tabShowActive"><a>Go To Current Tab</a></li>
          <li class="divider"></li>
          <li class="J_tabCloseAll"><a>Close All Tabs</a></li>
          <li class="J_tabCloseOther"><a>Close Other Tabs</a></li>
        </ul>
      </div>
      <a href="login.html" class="roll-nav roll-right J_tabExit"><i class="fa fa-sign-out"></i> LogOut</a>
    </div>

    <!-- ---------- iframe host ---------- -->
    <div class="row J_mainContent" id="content-main">
      <iframe class="J_iframe" name="iframe0" width="100%" height="100%"
              src="frames/home.html" frameborder="0"
              data-id="frames/home.html" seamless></iframe>
    </div>

  </div>
</div>

<script src="assets/apex-menu.js"></script>
<script>
(function () {
  'use strict';

  var menuHost   = document.getElementById('side-menu');
  var tabsHost   = document.getElementById('page-tabs-content');
  var frameHost  = document.getElementById('content-main');

  /* ------------------------------------------------------------ menu build */

  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function leafHtml(node, level) {
    return '<li><a class="J_menuItem" href="' + esc(node.href || 'javascript:;') + '" ' +
           'name="tabMenuItem" data-index="' + node.index + '">' + esc(node.label) + '</a></li>';
  }

  function groupHtml(node, level) {
    var cls = level === 1 ? 'nav nav-second-level collapse' : 'nav nav-third-level collapse';
    return '<li>' +
             '<a href="javascript:;" aria-expanded="false">' +
               (level === 0 && node.icon ? '<i class="fa ' + esc(node.icon) + '"></i>' : '') +
               '<span class="nav-label">' + esc(node.label) + '</span>' +
               '<span class="fa arrow">&#9656;</span>' +
             '</a>' +
             '<ul class="' + cls + '" aria-expanded="false">' +
               node.children.map(function (c) { return nodeHtml(c, level + 1); }).join('') +
             '</ul>' +
           '</li>';
  }

  function nodeHtml(node, level) {
    if (node.children && node.children.length) return groupHtml(node, level);
    if (node.index === undefined) return '';
    if (level === 0) {
      // top-level item that opens directly, e.g. "Update ATD&ATA"
      return '<li><a class="J_menuItem" href="' + esc(node.href || 'javascript:;') + '" ' +
             'name="tabMenuItem" data-index="' + node.index + '">' +
               (node.icon ? '<i class="fa ' + esc(node.icon) + '"></i>' : '') +
               '<span class="nav-label">' + esc(node.label) + '</span>' +
             '</a></li>';
    }
    return leafHtml(node, level);
  }

  menuHost.insertAdjacentHTML('beforeend',
    APEX_MENU.map(function (n) { return nodeHtml(n, 0); }).join(''));

  /* Accordion behaviour (metisMenu in production). */
  menuHost.addEventListener('click', function (e) {
    var a = e.target.closest('a[aria-expanded]');
    if (!a) return;
    e.preventDefault();
    var ul = a.nextElementSibling;
    if (!ul) return;
    var open = ul.classList.toggle('in');
    a.setAttribute('aria-expanded', open ? 'true' : 'false');
    ul.setAttribute('aria-expanded', open ? 'true' : 'false');
    a.closest('li').classList.toggle('active', open);
  });

  /* ------------------------------------------------------------ tabs */

  var HOME = { index: 0, name: 'HomePage', src: 'frames/home.html' };

  function frameSrc(index, name) {
    if (APEX_FRAME_SRC[index]) return APEX_FRAME_SRC[index];
    return 'frames/placeholder.html?index=' + encodeURIComponent(index) +
           '&name=' + encodeURIComponent(name);
  }

  function frameFor(index) {
    return frameHost.querySelector('iframe[name="iframe' + index + '"]');
  }

  /* An upload (or any other write) invalidates every grid that is already
     mounted, not just Import Confirm -- the old handler hard-coded frame 16,
     so a Pickup Report upload refreshed the wrong grid and nothing else.
     Each data frame exposes __APEX_MOCK__.reload(), which re-pulls from the
     API and keeps the frame's filters and page; a full reload is only the
     fallback for a frame that has not finished booting. */
  function refreshDataFrames(origin) {
    frameHost.querySelectorAll('iframe.J_iframe').forEach(function (f) {
      try {
        var win = f.contentWindow;
        if (!win || win === origin) return;   // the sender refreshed itself
        var mock = win.__APEX_MOCK__;
        if (mock && typeof mock.reload === 'function') mock.reload();
        else win.location.reload();
      } catch (err) {
        /* Frame still loading, or file:// opaque origin -- nothing to do. */
      }
    });
  }

  function tabFor(index) {
    return tabsHost.querySelector('.J_menuTab[data-index="' + index + '"]');
  }

  function showFrame(index) {
    // Production hides frames instead of unmounting them; a bot therefore has
    // to target the right frame rather than wait for navigation.
    frameHost.querySelectorAll('iframe.J_iframe').forEach(function (f) {
      f.style.display = f.getAttribute('name') === 'iframe' + index ? '' : 'none';
    });
    tabsHost.querySelectorAll('.J_menuTab').forEach(function (t) {
      t.classList.toggle('active', t.getAttribute('data-index') === String(index));
    });
    menuHost.querySelectorAll('.J_menuItem').forEach(function (a) {
      a.classList.toggle('tab-menu-selected', a.getAttribute('data-index') === String(index));
    });
  }

  function openMenu(index, name) {
    index = Number(index);
    var src = frameSrc(index, name);

    if (!frameFor(index)) {
      var f = document.createElement('iframe');
      f.className = 'J_iframe';
      f.setAttribute('name', 'iframe' + index);
      f.setAttribute('width', '100%');
      f.setAttribute('height', '100%');
      f.setAttribute('frameborder', '0');
      f.setAttribute('seamless', '');
      f.setAttribute('data-id', src);
      f.src = src;
      frameHost.appendChild(f);
    }

    if (!tabFor(index)) {
      var a = document.createElement('a');
      a.href = 'javascript:;';
      a.className = 'J_menuTab';
      a.setAttribute('data-id', src);
      a.setAttribute('data-index', index);
      a.innerHTML = esc(name) + ' <i class="fa fa-times-circle"></i>';
      tabsHost.appendChild(a);
    }

    showFrame(index);
  }

  function closeTab(index) {
    if (Number(index) === HOME.index) return;   // HomePage is permanent
    var tab = tabFor(index);
    var frm = frameFor(index);
    var wasActive = tab && tab.classList.contains('active');
    if (tab) tab.remove();
    if (frm) frm.remove();
    if (wasActive) {
      var last = tabsHost.querySelector('.J_menuTab:last-child');
      showFrame(last ? last.getAttribute('data-index') : HOME.index);
    }
  }

  menuHost.addEventListener('click', function (e) {
    var item = e.target.closest('a.J_menuItem');
    if (!item) return;
    e.preventDefault();
    var label = item.querySelector('.nav-label');
    openMenu(item.getAttribute('data-index'), (label ? label.textContent : item.textContent).trim());
  });

  tabsHost.addEventListener('click', function (e) {
    var tab = e.target.closest('.J_menuTab');
    if (!tab) return;
    if (e.target.closest('.fa-times-circle')) {
      closeTab(tab.getAttribute('data-index'));
    } else {
      showFrame(tab.getAttribute('data-index'));
    }
  });

  /* Tab strip controls */
  document.querySelector('.J_tabLeft').addEventListener('click', function () {
    tabsHost.style.marginLeft = Math.min(0, (parseInt(tabsHost.style.marginLeft || 0, 10) + 150)) + 'px';
  });
  document.querySelector('.J_tabRight').addEventListener('click', function () {
    tabsHost.style.marginLeft = (parseInt(tabsHost.style.marginLeft || 0, 10) - 150) + 'px';
  });

  var dropdown = document.getElementById('tab-dropdown');
  document.getElementById('btn-more').addEventListener('click', function (e) {
    e.stopPropagation();
    dropdown.classList.toggle('open');
  });
  document.addEventListener('click', function () { dropdown.classList.remove('open'); });

  document.querySelector('.J_tabShowActive').addEventListener('click', function () {
    var active = tabsHost.querySelector('.J_menuTab.active');
    if (active) active.scrollIntoView({ inline: 'center', block: 'nearest' });
    dropdown.classList.remove('open');
  });
  document.querySelector('.J_tabCloseAll').addEventListener('click', function () {
    tabsHost.querySelectorAll('.J_menuTab').forEach(function (t) {
      closeTab(t.getAttribute('data-index'));
    });
    showFrame(HOME.index);
    dropdown.classList.remove('open');
  });
  document.querySelector('.J_tabCloseOther').addEventListener('click', function () {
    var active = tabsHost.querySelector('.J_menuTab.active');
    var keep = active ? active.getAttribute('data-index') : String(HOME.index);
    tabsHost.querySelectorAll('.J_menuTab').forEach(function (t) {
      var i = t.getAttribute('data-index');
      if (i !== keep) closeTab(i);
    });
    dropdown.classList.remove('open');
  });

  /* Sidebar collapse */
  function toggleMini(e) { e.preventDefault(); document.body.classList.toggle('mini-navbar'); }
  document.getElementById('btn-minimalize').addEventListener('click', toggleMini);
  document.getElementById('btn-minimalize-2').addEventListener('click', toggleMini);

  /* ------------------------------------------------- messages from frames */

  window.addEventListener('message', function (e) {
    var msg = e.data;
    if (!msg || msg.source !== 'apex-frame') return;
    if (msg.action === 'open-menu') {
      openMenu(msg.index, msg.name);
    } else if (msg.action === 'data-changed') {
      refreshDataFrames(e.source);
    }
  });

  /* ---------------------------------------------------------------- boot */

  showFrame(HOME.index);

  /* Deep link: index.html#menu=16 opens Import Confirm on load. */
  var m = /(?:^|[#&])menu=(\d+)/.exec(location.hash);
  if (m) {
    var idx = Number(m[1]);
    var link = menuHost.querySelector('.J_menuItem[data-index="' + idx + '"]');
    openMenu(idx, link ? link.textContent.trim() : 'Module ' + idx);
  }

  /* Shell-level handle. The production shell exposes no such object; the bot's
     production adapter must drive the DOM instead. */
  window.__APEX_SHELL__ = {
    openMenu: openMenu,
    closeTab: closeTab,
    showFrame: showFrame,
    openTabs: function () {
      return Array.prototype.map.call(
        tabsHost.querySelectorAll('.J_menuTab'),
        function (t) { return Number(t.getAttribute('data-index')); });
    }
  };
})();
</script>
</body>
</html>
